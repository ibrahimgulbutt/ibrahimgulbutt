<rect class="snk" x="714" y="94" width="104" height="1"/>
<g class="row" style="animation-delay:0.00s"><rect x="714" y="110" width="104" height="22" rx="6" fill="var(--sunk)"/><rect x="720" y="116" width="10" height="10" rx="3" fill="var(--violet)" fill-opacity="0.9"/><rect x="736" y="119" width="70" height="4" rx="2" fill="var(--dim)" fill-opacity=".55"/></g>
<g class="row" style="animation-delay:0.28s"><rect x="714" y="140" width="104" height="22" rx="6" fill="var(--sunk)"/><rect x="720" y="146" width="10" height="10" rx="3" fill="var(--violet)" fill-opacity="0.9"/><rect x="736" y="149" width="61" height="4" rx="2" fill="var(--dim)" fill-opacity=".55"/></g>
<g class="row" style="animation-delay:0.56s"><rect x="714" y="170" width="104" height="22" rx="6" fill="var(--sunk)"/><rect x="720" y="176" width="10" height="10" rx="3" fill="var(--violet)" fill-opacity="0.25"/><rect x="736" y="179" width="52" height="4" rx="2" fill="var(--dim)" fill-opacity=".55"/></g>
<g class="row" style="animation-delay:0.84s"><rect x="714" y="200" width="104" height="22" rx="6" fill="var(--sunk)"/><rect x="720" y="206" width="10" height="10" rx="3" fill="var(--violet)" fill-opacity="0.25"/><rect x="736" y="209" width="43" height="4" rx="2" fill="var(--dim)" fill-opacity=".55"/></g>
<g class="row" style="animation-delay:1.12s"><rect x="714" y="230" width="104" height="22" rx="6" fill="var(--sunk)"/><rect x="720" y="236" width="10" height="10" rx="3" fill="var(--violet)" fill-opacity="0.25"/><rect x="736" y="239" width="34" height="4" rx="2" fill="var(--dim)" fill-opacity=".55"/></g>
