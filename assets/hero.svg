<rect class="chip" x="338" y="286" width="100" height="28" rx="14"/><text class="v" x="388" y="304.2" text-anchor="middle">Kubernetes</text>
<rect class="frm" x="700" y="44" width="132" height="292" rx="20"/>
<rect class="snk" x="749" y="52" width="34" height="6" rx="3"/>
