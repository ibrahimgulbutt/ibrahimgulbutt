<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
<title id="t">Ibrahim Gul Butt — Site Reliability and DevOps</title>
<desc id="d">A deploy moving through commit, build, test and deploy into a healthy production cluster.</desc>
<style>
  :root{
    --bg:#f6f8fa; --border:#d8dee4; --grid:#e9edf1; --card:#ffffff;
    --fg:#1f2328; --muted:#59636e; --dim:#818b98;
    --accent:#1a7f37; --flow:#0969da; --line:#d8dee4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --border:#283039; --grid:#161c24; --card:#111820;
      --fg:#e6edf3; --muted:#9198a1; --dim:#6e7781;
      --accent:#3fb950; --flow:#58a6ff; --line:#2b3542;
    }
  }

  .name{font:700 54px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);letter-spacing:-1.2px}
  .role{font:500 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--accent);letter-spacing:3.2px}
  .tag {font:400 19px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--muted)}
  .sub {font:400 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--dim)}
  .cap {font:400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim);letter-spacing:1.6px}
  .stg {font:500 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--muted);letter-spacing:.6px}
  .box {fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .wire{stroke:var(--line);stroke-width:2;stroke-linecap:round}

  .box.live{animation:lit 7.0s linear infinite}
  @keyframes lit{
    0%,4%    {stroke:var(--line);}
    9%,19%   {stroke:var(--accent);}
    25%,100% {stroke:var(--line);}
  }
  .lbl.live{animation:txt 7.0s linear infinite}
  @keyframes txt{
    0%,4%    {fill:var(--muted);}
    9%,19%   {fill:var(--accent);}
    25%,100% {fill:var(--muted);}
  }

  .packet{animation:fly 7.0s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes fly{
    0%   {transform:translateX(0px);opacity:0}
    4%   {opacity:1}
    62%  {transform:translateX(872px);opacity:1}
    69%  {transform:translateX(872px);opacity:0}
    100% {transform:translateX(872px);opacity:0}
  }

  .pod {fill:var(--accent);stroke:var(--line);stroke-width:1.5;fill-opacity:.10;
         animation:land 7.0s linear infinite}
  @keyframes land{
    0%,63%   {fill-opacity:.10;stroke:var(--line)}
    68%,88%  {fill-opacity:.80;stroke:var(--accent)}
    94%,100% {fill-opacity:.10;stroke:var(--line)}
  }

  @media (prefers-reduced-motion: reduce){
    .box.live,.lbl.live,.packet,.pod{animation:none}
    .packet{opacity:0}
  }
</style>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><clipPath id="c"><rect x="1" y="1" width="1198" height="390" rx="18"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="390" rx="18" fill="var(--bg)"/>
<rect clip-path="url(#c)" x="1" y="1" width="1198" height="390" fill="url(#g)"/>
<rect x="1" y="1" width="1198" height="390" rx="18" fill="none" stroke="var(--border)" stroke-width="1.5"/>
<text class="name" x="64" y="104">Ibrahim Gul Butt</text>
<text class="role" x="66" y="140">SITE RELIABILITY  ·  DEVOPS  ·  LAHORE, PAKISTAN</text>
<text class="tag" x="64" y="188">I keep production systems up — and build the things I wish existed.</text>
<text class="sub" x="64" y="216">Final year, Software Engineering @ FAST-NUCES · graduating December 2026</text>
<line class="wire" x1="64" y1="252" x2="1136" y2="252" stroke="var(--border)" stroke-width="1"/>
<line class="wire" x1="192" y1="307" x2="244" y2="307"/>
<line class="wire" x1="372" y1="307" x2="424" y2="307"/>
<line class="wire" x1="552" y1="307" x2="604" y2="307"/>
<line class="wire" x1="732" y1="307" x2="790" y2="307"/>
<rect class="box live" x="64" y="286" width="128" height="42" rx="9" style="animation-delay:0.00s"/>
<text class="stg lbl live" x="128" y="311.5" text-anchor="middle" style="animation-delay:0.00s">commit</text>
<rect class="box live" x="244" y="286" width="128" height="42" rx="9" style="animation-delay:1.19s"/>
<text class="stg lbl live" x="308" y="311.5" text-anchor="middle" style="animation-delay:1.19s">build</text>
<rect class="box live" x="424" y="286" width="128" height="42" rx="9" style="animation-delay:2.38s"/>
<text class="stg lbl live" x="488" y="311.5" text-anchor="middle" style="animation-delay:2.38s">test</text>
<rect class="box live" x="604" y="286" width="128" height="42" rx="9" style="animation-delay:3.57s"/>
<text class="stg lbl live" x="668" y="311.5" text-anchor="middle" style="animation-delay:3.57s">deploy</text>
<rect x="790" y="270" width="346" height="76" rx="11" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
<rect class="pod" x="812" y="281" width="26" height="26" rx="7" style="animation-delay:0.00s"/>
<rect class="pod" x="846" y="281" width="26" height="26" rx="7" style="animation-delay:0.05s"/>
<rect class="pod" x="880" y="281" width="26" height="26" rx="7" style="animation-delay:0.10s"/>
<rect class="pod" x="914" y="281" width="26" height="26" rx="7" style="animation-delay:0.15s"/>
<rect class="pod" x="948" y="281" width="26" height="26" rx="7" style="animation-delay:0.20s"/>
<rect class="pod" x="982" y="281" width="26" height="26" rx="7" style="animation-delay:0.25s"/>
<rect class="pod" x="812" y="313" width="26" height="26" rx="7" style="animation-delay:0.30s"/>
<rect class="pod" x="846" y="313" width="26" height="26" rx="7" style="animation-delay:0.35s"/>
<rect class="pod" x="880" y="313" width="26" height="26" rx="7" style="animation-delay:0.40s"/>
<rect class="pod" x="914" y="313" width="26" height="26" rx="7" style="animation-delay:0.45s"/>
<rect class="pod" x="948" y="313" width="26" height="26" rx="7" style="animation-delay:0.50s"/>
<rect class="pod" x="982" y="313" width="26" height="26" rx="7" style="animation-delay:0.55s"/>
<text class="cap" x="1026" y="312">production</text>
<g class="packet"><circle cx="128" cy="307" r="5" fill="var(--flow)"/></g>
</svg>