<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="ht hd">
<title id="ht">Ibrahim Gul Butt. I build mobile apps, web apps, desktop apps, Linux internals, cloud platforms and ML pipelines</title>
<desc id="hd">A rotating headline beside a phone, a browser window and a terminal, each running.</desc>
<style>
  :root{
    --bg:#f6f8fa; --border:#d8dee4; --grid:#e9edf1; --card:#ffffff; --sunk:#eef1f4;
    --fg:#1f2328; --muted:#59636e; --dim:#818b98; --line:#d8dee4;
    --green:#1a7f37; --blue:#0969da; --violet:#8250df; --amber:#9a6700; --cyan:#1b7c83;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --border:#283039; --grid:#161c24; --card:#111820; --sunk:#0a0f16;
      --fg:#e6edf3; --muted:#9198a1; --dim:#6e7781; --line:#2b3542;
      --green:#3fb950; --blue:#58a6ff; --violet:#a371f7; --amber:#d29922; --cyan:#39c5cf;
    }
  }

  .nm  {font:700 50px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);letter-spacing:-1.4px}
  .eye {font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim);letter-spacing:3.4px}
  .wd  {font:700 36px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:-.5px}
  .sub {font:400 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--muted)}
  .sub2{font:400 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--dim)}
  .v   {font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--muted)}
  .chip{fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .frm {fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .snk {fill:var(--sunk)}
  .tt  {font:400 9px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .lbl {font:500 8.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim);letter-spacing:1.2px}

  .rw{opacity:0;animation:rot 13.799999999999999s ease-in-out infinite}
  @keyframes rot{
    0%           {opacity:0;transform:translateY(9px)}
    2%,13.7%  {opacity:1;transform:translateY(0)}
    16.7%,100%    {opacity:0;transform:translateY(-9px)}
  }
  .car{animation:blink 1.06s steps(1) infinite}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

  .row{opacity:0;animation:slide 6s ease-out infinite}
  @keyframes slide{
    0%,6%    {opacity:0;transform:translateX(14px)}
    14%,86%  {opacity:1;transform:translateX(0)}
    94%,100% {opacity:0;transform:translateX(0)}
  }
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 6s ease-out infinite}
  @keyframes grow{
    0%,8%    {transform:scaleY(.06)}
    26%,84%  {transform:scaleY(1)}
    96%,100% {transform:scaleY(.06)}
  }
  .tl{opacity:0;animation:tline 6s steps(1) infinite}
  @keyframes tline{0%,8%{opacity:0}12%,92%{opacity:1}96%,100%{opacity:0}}
  .nav{animation:hop 6s steps(1) infinite}
  @keyframes hop{0%,33%{fill:var(--violet)}33.01%,100%{fill:var(--line)}}

  .por{font:4.6px/5.6px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#7d8892;white-space:pre;
        animation:ripple 3.4s ease-in-out infinite, shimmer 3.4s ease-in-out infinite}
  @keyframes ripple{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
  @keyframes shimmer{0%,100%{fill:#7d8892}50%{fill:#e6edf3}}

  @media (prefers-reduced-motion: reduce){
    .rw,.car,.row,.bar,.tl,.nav,.por{animation:none}
    .rw:first-of-type{opacity:1}
    .row,.tl{opacity:1}
    .por{fill:#c9d1d9}
  }
</style>
