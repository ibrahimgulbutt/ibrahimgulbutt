<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="dt dd">
<title id="dt">Live activity dashboard for ibrahimgulbutt</title>
<desc id="dd">371 contributions in the last year across 17 repositories, refreshed daily.</desc>
<style>
  :root{
    --bg:#f6f8fa; --border:#d8dee4; --grid:#e9edf1; --card:#ffffff; --sunk:#eef1f4;
    --fg:#1f2328; --muted:#59636e; --dim:#818b98; --line:#d8dee4;
    --green:#1a7f37; --blue:#0969da; --violet:#8250df; --amber:#9a6700; --cyan:#1b7c83;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --border:#283039; --grid:#161c24; --card:#111820; --sunk:#0a0f16;
      --fg:#e6edf3; --muted:#9198a1; --dim:#6e7781; --line:#2b3542;
      --green:#3fb950; --blue:#58a6ff; --violet:#a371f7; --amber:#d29922; --cyan:#39c5cf;
    }
  }

  .h {font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim);letter-spacing:2.4px}
  .k {font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim);letter-spacing:1.6px}
  .n {font:700 34px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);letter-spacing:-1px}
  .s {font:400 11px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--muted)}
  .ax{font:400 9.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim)}
  .lb{font:500 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
  .lc{font:400 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--dim)}
  .card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5;opacity:.65}

  .line{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;
         stroke-linejoin:round;stroke-dasharray:4000;stroke-dashoffset:4000;
         animation:draw 3.4s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .area{fill:url(#ag);opacity:0;animation:fade 1.6s ease-out 1.5s forwards}
  @keyframes fade{to{opacity:1}}

  .scan{stroke:var(--green);stroke-width:1.5;opacity:.5;
         animation:sweep 6s linear infinite}
  @keyframes sweep{
    0%{transform:translateX(0);opacity:0}
    6%{opacity:.5}
    94%{opacity:.5}
    100%{transform:translateX(792px);opacity:0}
  }

  .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);
        animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}

  .dot{animation:beat 2s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}

  @media (prefers-reduced-motion: reduce){
    .line{stroke-dashoffset:0;animation:none}
    .area{opacity:1;animation:none}
    .bar{transform:scaleX(1);animation:none}
    .scan,.dot{animation:none}
    .scan{opacity:0}
  }
</style>
